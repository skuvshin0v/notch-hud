name: Bug report
description: Something in the island or the mod does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. A screenshot of the island helps.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.3, MacBook Pro 14" M2
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version (`claude --version`)
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Notch HUD version (`claude plugin list`)
  - type: dropdown
    id: where
    attributes:
      label: Where the session runs
      multiple: true
      options: [Terminal, iTerm2, Ghostty, VS Code terminal, VS Code extension, Claude desktop app (Code tab), Background session (/bg)]
